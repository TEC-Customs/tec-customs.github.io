# 1) Unpacks _bundle/ (text-encoded files pushed via the API) into hvac-demo/ and deletes it.
# 2) Renders hvac-demo/og-image.png (social link preview) from the real demo with headless Chromium.
# 3) Commits the result and asks GitHub Pages to rebuild (GITHUB_TOKEN pushes don't trigger Pages on their own).
name: Build site assets

on:
  push:
    branches: [main]
    paths:
      - "_bundle/**"
      - "hvac-demo/**"
      - "!hvac-demo/og-image.png"
      - ".github/og/**"
      - ".github/workflows/site-build.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpack bundle
        run: python .github/og/unpack_bundle.py
      - name: Check widget present
        id: chk
        run: if [ -f hvac-demo/chatbot/tec-chat.js ] && [ -f hvac-demo/chatbot/presets.js ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Fonts
        if: steps.chk.outputs.ok == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-core fonts-noto-color-emoji
      - name: Playwright + Chromium
        if: steps.chk.outputs.ok == 'true'
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Render og-image.png
        if: steps.chk.outputs.ok == 'true'
        run: python .github/og/make_og.py hvac-demo
      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Unpack site bundle / render og-image.png"
          git pull --rebase -q origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "::warning::Pages build request failed; next push will publish"
